<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3a52"/>
      <stop offset="1" stop-color="#151d2b"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#33d17a"/>
      <stop offset="0.5" stop-color="#3584e4"/>
      <stop offset="1" stop-color="#c061cb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- flate -->
  <rect x="8" y="10" width="112" height="110" rx="24" fill="#0d131d" opacity="0.35"/>
  <rect x="8" y="6" width="112" height="110" rx="24" fill="url(#bg)"/>
  <rect x="8" y="6" width="112" height="55" rx="24" fill="url(#shine)"/>
  <!-- skala (svak bakgrunnsbue) -->
  <path d="M30.4 89.6A38 38 0 1 1 97.6 89.6" fill="none" stroke="#ffffff" stroke-opacity="0.12"
        stroke-width="11" stroke-linecap="round"/>
  <!-- bue i farger -->
  <path d="M30.4 89.6A38 38 0 1 1 97.6 89.6" fill="none" stroke="url(#arc)" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="150 400"/>
  <!-- streker -->
  <g stroke="#ffffff" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round">
    <path d="M64 32v6"/><path d="M38.5 42.5l4.2 4.2"/><path d="M89.5 42.5l-4.2 4.2"/>
  </g>
  <!-- viser -->
  <path d="M64 70 85 49" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  <circle cx="64" cy="70" r="9" fill="#ffffff"/>
  <circle cx="64" cy="70" r="3.5" fill="#2b3a52"/>
  <!-- tre små søyler (ytelse) -->
  <g fill="#ffffff" fill-opacity="0.9">
    <rect x="48" y="92" width="8" height="12" rx="2"/>
    <rect x="60" y="86" width="8" height="18" rx="2"/>
    <rect x="72" y="80" width="8" height="24" rx="2"/>
  </g>
</svg>

<html lang="nb">
<head>
<meta charset="utf-8">

<title>Kontrollsenter</title>
<style>
:root { --ga:#5b8cff; --gb:#8a5cff; --gc:#00c8b4; --bg:#090a12; --card:rgba(255,255,255,.045); --card-solid:#151626; --card2:rgba(255,255,255,.07); --fg:#f4f5fb; --dim:#9ea2bd;
  --line:rgba(255,255,255,.075); --hi:rgba(255,255,255,.06); --acc:#6f8bff; --grad:linear-gradient(135deg,var(--ga),var(--gb));
  --ok:#3ddc97; --bad:#ff6b7a; --shadow:0 1px 0 var(--hi) inset, 0 18px 40px -22px rgba(0,0,0,.65);
  --aurora: radial-gradient(60% 45% at 8% -5%, color-mix(in srgb, var(--ga) 32%, transparent), transparent 70%),
            radial-gradient(50% 40% at 100% 0%, color-mix(in srgb, var(--acc2) 28%, transparent), transparent 70%),
            radial-gradient(70% 50% at 50% 115%, rgba(0,200,180,.10), transparent 70%); }
@media (prefers-color-scheme: light) { :root { --bg:#f4f5fb; --card:rgba(255,255,255,.8); --card-solid:#fff; --card2:rgba(20,24,60,.055);
  --fg:#141625; --dim:#626784; --line:rgba(20,24,60,.08); --hi:rgba(255,255,255,.9); --shadow:0 1px 0 var(--hi) inset, 0 14px 34px -20px rgba(40,50,120,.28);
  --aurora: radial-gradient(60% 45% at 8% -5%, color-mix(in srgb, var(--ga) 20%, transparent), transparent 70%), radial-gradient(50% 40% at 100% 0%, color-mix(in srgb, var(--acc2) 16%, transparent), transparent 70%); } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:15.5px/1.45 system-ui, Roboto, sans-serif; -webkit-font-smoothing:antialiased; }
body::before { content:""; position:fixed; inset:0; background:var(--aurora); pointer-events:none; }
main { position:relative; max-width:1100px; margin:0 auto; padding:calc(28px + env(safe-area-inset-top)) 16px 40px; }
.head { display:flex; align-items:center; gap:14px; }
.logo { width:48px; height:48px; border-radius:16px; background:var(--grad); box-shadow:0 12px 26px -10px color-mix(in srgb, var(--acc) 90%, transparent); flex:none;
  display:flex; align-items:center; justify-content:center; }
.logo svg { width:26px; height:26px; fill:none; stroke:#fff; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
h1 { font-size:27px; margin:0; letter-spacing:-.03em; font-weight:800; }
.dim { color:var(--dim); } .small { font-size:13px; }
.sum { margin-top:2px; }
.bar { display:flex; gap:10px; margin:22px 0 6px; }
.bar .grow { flex:1; }
button { font:inherit; font-weight:600; color:var(--fg); background:var(--card2); border:0; border-radius:16px; padding:12px 18px; min-height:50px;
  transition:transform .08s, filter .15s; cursor:pointer; }
button:active { transform:scale(.97); }
button.primary { background:var(--grad); color:#fff; box-shadow:0 12px 24px -12px color-mix(in srgb, var(--acc) 95%, transparent); }
button.ic-btn { width:50px; padding:0; display:flex; align-items:center; justify-content:center; flex:none; }
button.ic-btn svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
input { font:inherit; color:var(--fg); background:var(--card2); border:1px solid var(--line); border-radius:16px; padding:12px 14px; flex:1; min-width:0; outline:none; min-height:50px; }
input:focus { border-color:var(--acc); }
details.add { margin:6px 0 0; } details.add summary { list-style:none; color:var(--acc); font-weight:650; padding:8px 2px; cursor:pointer; }
details.add summary::-webkit-details-marker { display:none; }
details.add .row { display:flex; gap:10px; margin-top:6px; }
h2 { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; margin:26px 4px 12px; font-weight:700; }
.list { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%,330px), 1fr)); }
.pc { background:var(--card); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:24px; padding:16px;
  -webkit-backdrop-filter:blur(22px) saturate(140%); backdrop-filter:blur(22px) saturate(140%); display:flex; flex-direction:column; gap:14px; }
.pc.off { opacity:.9; } .pc.off .go { background:var(--card2); color:var(--fg); box-shadow:none; }
.pc-head { display:flex; align-items:center; gap:14px; min-width:0; }
.pc .ic { width:52px; height:52px; border-radius:17px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:26px; flex:none; }
.pc.on .ic { background:linear-gradient(135deg, color-mix(in srgb, var(--ga) 25%, transparent), color-mix(in srgb, var(--gb) 20%, transparent)); }
.pc .t { flex:1; min-width:0; }
.pc .t b { display:block; font-size:18px; font-weight:750; letter-spacing:-.01em; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc .t .meta { display:block; font-size:13px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
.pc .x { background:transparent; color:var(--dim); width:40px; min-height:40px; padding:0; flex:none; border-radius:12px; font-size:18px; }
.stats { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
.stats:empty { display:none; }
.stats > div { background:var(--card2); border-radius:14px; padding:9px 12px; }
.stats .n { font-size:11px; color:var(--dim); text-transform:uppercase; letter-spacing:.08em; font-weight:700; }
.stats .v { font-size:17px; font-weight:750; font-variant-numeric:tabular-nums; }
.game-now { font-size:14px; padding:9px 12px; border-radius:14px; background:linear-gradient(135deg, rgba(61,220,151,.16), rgba(61,220,151,.05)); color:var(--fg); }
.game-now:empty { display:none; }
.hint { font-size:13px; color:var(--dim); } .hint:empty { display:none; }
.pc-actions { display:flex; gap:10px; }
.pc-actions button { flex:1; }
.pc .wake { background:rgba(61,220,151,.15); color:var(--ok); }
.dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--dim); margin-right:6px; vertical-align:1px; }
.dot.ok { background:var(--ok); box-shadow:0 0 0 3px rgba(61,220,151,.18); } .dot.bad { background:var(--bad); }
#status { margin-top:10px; min-height:1em; line-height:1.5; }
#scan-bar { height:4px; background:var(--card2); border-radius:2px; overflow:hidden; margin-top:10px; }
#scan-bar i { display:block; height:100%; width:0; background:var(--grad); transition:width .2s; }
.upd { display:flex; align-items:center; gap:12px; padding:12px 14px 12px 16px; background:var(--grad); color:#fff; border-radius:20px; margin:18px 0 0;
  box-shadow:0 14px 30px -16px color-mix(in srgb, var(--acc) 95%, transparent); }
.upd span { flex:1; font-weight:600; } .upd button { background:#fff; color:#5b6cff; min-height:42px; }
.games-btn { width:100%; margin-top:16px; }
.gl { display:grid; gap:12px; grid-template-columns:repeat(auto-fill, minmax(min(100%,320px),1fr)); margin-top:12px; }
.gi { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:14px 16px; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); }
.gi b { display:block; margin-bottom:10px; font-weight:700; } .gi .btns { display:flex; gap:8px; flex-wrap:wrap; }
.gi button { min-height:42px; padding:8px 14px; flex:1 1 auto; }
.foot { margin-top:28px; text-align:center; line-height:1.6; }
[hidden] { display:none !important; }
@media (hover: hover) {
  button { transition: box-shadow .22s ease, filter .16s; }
  button:not(:disabled):hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.28), 0 0 0 1px rgba(138,155,255,.65), 0 0 16px 1px rgba(106,123,255,.55), 0 0 36px 6px color-mix(in srgb, var(--gb) 30%, transparent) !important; }
  button.primary:not(:disabled):hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.55), 0 0 22px 3px rgba(106,123,255,.85), 0 0 52px 10px color-mix(in srgb, var(--gb) 45%, transparent) !important; filter: brightness(1.08); }
  .pc:hover { box-shadow: inset 0 1px 0 rgba(255,255,255,.3), 0 0 0 1px rgba(138,155,255,.45), 0 0 30px rgba(106,123,255,.3) !important; }
}
/* flytende glass */
body::before { background:
  radial-gradient(42% 32% at 12% 6%, color-mix(in srgb, var(--ga) 42%, transparent), transparent 70%),
  radial-gradient(38% 30% at 92% 12%, color-mix(in srgb, var(--acc2) 38%, transparent), transparent 70%),
  radial-gradient(46% 30% at 30% 62%, rgba(0,200,180,.16), transparent 70%),
  radial-gradient(40% 28% at 85% 88%, rgba(255,120,170,.14), transparent 70%); }
.pc, .gi { position:relative; background-color:rgba(255,255,255,.055);
  background-image:linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,.05));
  border-color:rgba(255,255,255,.13); -webkit-backdrop-filter:blur(28px) saturate(190%) brightness(1.06); backdrop-filter:blur(28px) saturate(190%) brightness(1.06);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.30), inset 1px 0 0 rgba(255,255,255,.06), 0 24px 48px -24px rgba(0,0,0,.65); }
.pc::after { content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none;
  background: radial-gradient(120% 60% at 0% 0%, rgba(255,255,255,.14), transparent 42%); }
.pc > * { position:relative; z-index:1; }
button:not(.x), input, .stats > div { background-color:rgba(255,255,255,.07);
  background-image:linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,0) 60%); box-shadow: inset 0 1px 0 rgba(255,255,255,.16), 0 0 0 1px rgba(255,255,255,.08); }
.logo { box-shadow: inset 0 1px 0 rgba(255,255,255,.5), inset 0 -3px 8px rgba(0,0,0,.14), 0 12px 26px -12px color-mix(in srgb, var(--acc) 95%, transparent); }
.pc .wake { background-color:rgba(61,220,151,.16); }
@media (prefers-color-scheme: light) {
  .pc, .gi { background-color:rgba(255,255,255,.55); border-color:rgba(20,24,60,.09); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), 0 18px 40px -22px rgba(40,50,120,.35); }
  button:not(.x), input, .stats > div { box-shadow: inset 0 1px 0 rgba(255,255,255,.9), 0 0 0 1px rgba(20,24,60,.08); }
}


/* ---------- ryddig startside: topp, verktøylinje og faner nederst ---------- */
main { padding-bottom:calc(110px + env(safe-area-inset-bottom)); }
.head { gap:14px; }
.head .ht { flex:1; min-width:0; }
.head .ic-btn { min-height:44px; width:44px; border-radius:14px; }
.tools { display:flex; gap:8px; margin:20px 0 4px; align-items:center; overflow-x:auto; scrollbar-width:none; }
.tools::-webkit-scrollbar { display:none; }
.tool { display:flex; align-items:center; gap:8px; min-height:42px; padding:8px 14px; border-radius:99px; font-size:14px; white-space:nowrap; flex:none; }
.tool svg { width:18px; height:18px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.tools .grow { flex:1; text-align:right; padding-right:4px; }
.add-row { display:flex; gap:10px; margin-top:10px; }
#status:empty, #smart-status:empty { display:none; }
#status, #smart-status { margin:10px 4px 0; }
.list { margin-top:14px; }
.foot { margin-top:22px; opacity:.8; }
.ver { text-align:center; margin-top:14px; opacity:.6; }
.tabs { position:fixed; z-index:10; left:50%; transform:translateX(-50%); bottom:calc(12px + env(safe-area-inset-bottom));
  width:min(360px, calc(100vw - 32px)); display:flex; gap:4px; padding:6px; border-radius:26px;
  background:rgba(18,19,32,.62); border:1px solid rgba(255,255,255,.12);
  -webkit-backdrop-filter:blur(30px) saturate(200%); backdrop-filter:blur(30px) saturate(200%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14), 0 24px 50px -18px rgba(0,0,0,.7); }
.tabs button { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; min-height:54px; padding:6px 2px;
  border-radius:20px; background:transparent !important; box-shadow:none !important; color:var(--dim); font-size:11px; font-weight:650; }
.tabs button svg { width:24px; height:24px; fill:none; stroke:currentColor; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }
.tabs button.on { background:rgba(255,255,255,.10) !important; color:var(--fg); }
.tabs button.on svg { stroke:var(--acc); }
@media (prefers-color-scheme: light) { .tabs { background:rgba(255,255,255,.7); border-color:rgba(20,24,60,.1); } .tabs button.on { background:rgba(20,24,60,.07) !important; } }

/* ---------- Smart Hjem ---------- */
.sh-sec { font-size:12px; color:var(--dim); text-transform:uppercase; letter-spacing:.1em; margin:24px 4px 10px; font-weight:700; }
.sh-grid { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(min(100%,330px), 1fr)); }
.sh-card { position:relative; border-radius:24px; padding:16px; display:flex; flex-direction:column; gap:12px;
  background-color:rgba(255,255,255,.055); border:1px solid rgba(255,255,255,.13);
  background-image:linear-gradient(150deg, rgba(255,255,255,.14), rgba(255,255,255,.02) 36%, rgba(255,255,255,0) 60%, rgba(255,255,255,.05));
  -webkit-backdrop-filter:blur(28px) saturate(190%); backdrop-filter:blur(28px) saturate(190%);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.30), 0 24px 48px -24px rgba(0,0,0,.65); }
.sh-head { display:flex; align-items:center; gap:14px; min-width:0; }
.sh-ic { width:48px; height:48px; border-radius:16px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:24px; flex:none; }
.sh-card.live .sh-ic { background:linear-gradient(135deg, color-mix(in srgb, var(--ga) 28%, transparent), color-mix(in srgb, var(--gb) 22%, transparent)); }
.sh-t { flex:1; min-width:0; }
.sh-t b { display:block; font-size:17px; font-weight:750; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sh-t span { display:block; font-size:13px; color:var(--dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:1px; }
.sh-now { font-size:14px; padding:9px 12px; border-radius:14px; background:linear-gradient(135deg, color-mix(in srgb, var(--ga) 18%, transparent), color-mix(in srgb, var(--gb) 7%, transparent)); }
.sh-btns { display:flex; gap:8px; flex-wrap:wrap; }
.sh-btns button { flex:1 1 0; min-width:56px; min-height:46px; padding:8px 10px; font-size:15px; }
.sh-vol { display:flex; align-items:center; gap:10px; font-size:13px; color:var(--dim); }
.sh-vol input[type=range] { flex:1; padding:0; border:0; background:none; min-height:34px; accent-color:var(--gb); }
.sh-vol .num { min-width:42px; text-align:right; font-variant-numeric:tabular-nums; color:var(--fg); }
.sh-lights { display:flex; flex-direction:column; gap:2px; }
.sh-light { display:grid; grid-template-columns:auto 1fr auto; align-items:center; column-gap:12px; row-gap:2px; padding:10px 2px; border-top:1px solid var(--line); }
.sh-light .l-bri { grid-column:2 / 4; width:100% !important; }
.sh-light:first-child { border-top:0; }
.sh-light .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.sh-light .nm small { display:block; color:var(--dim); font-weight:500; }
.sh-light input[type=range] { width:100%; padding:0; border:0; background:none; min-height:30px; accent-color:var(--gb); flex:none; }
.sh-light input[type=color] { width:34px; height:34px; min-height:0; padding:0; border:0; border-radius:50%; background:none; flex:none; }
.sh-light input[type=color]::-webkit-color-swatch-wrapper { padding:0; } .sh-light input[type=color]::-webkit-color-swatch { border:2px solid rgba(255,255,255,.3); border-radius:50%; }
.sh-light.off .nm { color:var(--dim); }
.sh-rooms { display:flex; gap:8px; flex-wrap:wrap; }
.sh-rooms button { min-height:42px; padding:8px 14px; border-radius:99px; font-size:14px; }
.switch { position:relative; width:52px; height:30px; flex:none; display:inline-block; }
.switch input { opacity:0; width:0; height:0; position:absolute; }
.switch i { position:absolute; inset:0; background:var(--card2); border-radius:999px; transition:.2s; border:1px solid var(--line); }
.switch i::after { content:""; position:absolute; left:3px; top:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.2s; box-shadow:0 2px 6px rgba(0,0,0,.3); }
.switch input:checked + i { background:var(--grad); border-color:transparent; }
.switch input:checked + i::after { transform:translateX(22px); }
.sh-list { border-radius:22px; overflow:hidden; background-color:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.1);
  -webkit-backdrop-filter:blur(22px); backdrop-filter:blur(22px); }
.sh-row { display:flex; align-items:center; gap:12px; padding:11px 14px; border-top:1px solid var(--line); }
.sh-row:first-child { border-top:0; }
.sh-row .e { font-size:20px; width:30px; text-align:center; flex:none; }
.sh-row .sh-t b { font-size:15px; font-weight:650; } .sh-row .sh-t span { font-size:12.5px; }
.sh-row .ip { font-size:12px; color:var(--dim); font-variant-numeric:tabular-nums; }
.sh-more { width:100%; margin-top:10px; }
.sh-empty { text-align:center; padding:40px 16px; color:var(--dim); line-height:1.6; }
.sh-empty .big { font-size:42px; display:block; margin-bottom:8px; }
button.on:not(.tabs button) { background:var(--grad) !important; color:#fff !important; box-shadow:0 3px 10px color-mix(in srgb, var(--ga) 30%, transparent) !important; }

/* knapper er vanlige i ro og lyser lilla bare mens fingeren holdes på dem */
button.primary { color:var(--fg); }
button:not(:disabled):not(.x):not(.tabs button):active { background:var(--grad) !important; color:#fff !important; box-shadow:0 0 0 1px rgba(255,255,255,.25), 0 0 18px 2px rgba(106,123,255,.6) !important; }
button:not(:disabled):active svg { stroke:#fff; }
/* hold fingeren og dra for å flytte */
.pc, .sh-grid > .sh-card, .sh-list > .sh-row { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.s-drag { position: relative; z-index: 30; transition: none !important; touch-action: none;
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--gb) 90%, transparent), 0 26px 50px -14px rgba(0,0,0,.55), 0 0 40px -6px color-mix(in srgb, var(--acc) 80%, transparent) !important; }
.s-glow { animation: s-glow .9s ease-out; }
@keyframes s-glow { 0% { box-shadow: 0 0 0 4px color-mix(in srgb, var(--gb) 95%, transparent), 0 0 46px 4px color-mix(in srgb, var(--ga) 75%, transparent); }
  100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--gb) 0%, transparent), 0 0 0 0 color-mix(in srgb, var(--ga) 0%, transparent); } }
</style>

<body>
<main>
  <header class="head">
    <span class="logo"><svg viewBox="0 0 24 24"><path d="M5 18a8 8 0 1 1 14 0"/><path d="M12 14l4-5"/></svg></span>
    <div class="ht"><h1 id="title">Kontrollsenter</h1><div class="dim small sum" id="sum">Velg PC-en du vil styre</div></div>
    <button id="upd-check" class="ic-btn" title="Se etter oppdatering" aria-label="Se etter oppdatering"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg></button>
    <button id="upd-gh" class="ic-btn" title="Oppdater fra GitHub" aria-label="Oppdater fra GitHub" hidden><svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 20h14"/></svg></button>
  </header>
  <div id="upd" class="upd" hidden><span id="upd-t"></span><button id="upd-go">Oppdater</button></div>

  <section id="p-pcs" class="page">
    <div class="tools">
      <button id="scan" class="tool"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Søk</button>
      <button id="add-open" class="tool"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Legg til</button>
      <button id="all-games" class="tool"><svg viewBox="0 0 24 24"><path d="M6 9h12a4 4 0 0 1 4 4v1a3 3 0 0 1-5.2 2L15 14H9l-1.8 2A3 3 0 0 1 2 14v-1a4 4 0 0 1 4-4z"/></svg>Spill</button>
    </div>
    <div id="add-row" class="row add-row" hidden><input id="manual" placeholder="Adresse, f.eks. 192.168.1.20" inputmode="url"><button id="add" class="primary">Legg til</button></div>
    <div id="scan-bar" hidden><i></i></div>
    <div id="status" class="dim small"></div>
    <div id="pcs" class="list"></div>
    <div id="games" class="gl"></div>
    <p class="dim small foot">Ser du ikke en PC? Slå på <b>Tillat fjernstyring</b> i Kontrollsenter på PC-en<br>(Innstillinger → Mobil).<br>Hold fingeren på et kort for å flytte det.</p>
  </section>

  <section id="p-smart" class="page" hidden>
    <div class="tools">
      <button id="smart-scan" class="tool"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7"/><path d="M21 4v5h-5"/></svg>Søk på nytt</button>
      <span id="smart-from" class="dim small grow"></span>
    </div>
    <div id="smart-status" class="dim small"></div>
    <div id="smart"></div>
  </section>
  <p class="dim small ver"><span id="ver"></span> · <a href="https://github.com/vegardwaagan-dotcom/Kontrollsenter" class="gh-link">Kontrollsenter på GitHub</a></p>
</main>
<nav class="tabs" id="tabs">
  <button data-tab="pcs" class="on"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg><span>PC-er</span></button>
  <button data-tab="smart"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Smart Hjem</span></button>
</nav>
<script>
"use strict";
const PORT = 27100, $ = (s) => document.querySelector(s);
const KS = window.KS || null;
let pcs = []; try { pcs = JSON.parse(localStorage.getItem("pcs") || "[]"); } catch (e) {}
const save = () => localStorage.setItem("pcs", JSON.stringify(pcs));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function hello(host, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 1500);
  try {
    const r = await fetch(`http://${host}:${PORT}/api/hello`, { signal: ctl.signal, cache: "no-store" });
    const j = await r.json();
    return j && j.app === "Kontrollsenter" ? j : null;
  } catch (e) { return null; } finally { clearTimeout(t); }
}
const isTs = (h) => /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(h) || /\.ts\.net$/.test(h);
function remember(host, j) {
  const p = pcs.find((x) => (j.name && x.name === j.name) || x.host === host || x.ts === host);
  const lan = isTs(host) ? (p && p.host) || (j.lan || [])[0] || host : host;
  const info = { host: lan, name: j.name, os: j.os, version: j.version };
  if (j.ts) { info.ts = j.ts.ip; info.tsname = j.ts.name; }
  if (j.mac) info.mac = j.mac;
  if (p) Object.assign(p, info); else pcs.push(info);
  save();
}
// hjemme: hjemmeadressen; ute: Tailscale-adressen (eller -navnet)
async function reach(p, ms) {
  for (const h of [p.host, p.ts, p.tsname].filter(Boolean)) {
    const j = await hello(h, isTs(h) ? Math.max(ms || 1500, 3000) : (ms || 1500));
    if (j) return { h, j };
  }
  return null;
}
async function open(p) {
  $("#status").textContent = "Kobler til " + (p.name || p.host) + " …";
  const r = await reach(p);
  if (!r) { $("#status").textContent = `${p.name || p.host} svarer ikke – hjemme eller via Tailscale.`; return; }
  p.last = Date.now(); remember(r.h, r.j);
  localStorage.setItem("lastHost", p.host);
  location.href = `http://${r.h}:${PORT}/app/`;
}

// ---------- hold fingeren på et kort og dra det til ny plass (rekkefølgen huskes) ----------
const SORT_KEY = "ks_start_order";
let sDrag = null, sPressed = 0;
function sOrder() { try { return JSON.parse(localStorage.getItem(SORT_KEY)) || {}; } catch (e) { return {}; } }
function sSort(key, arr, idf) {
  const o = sOrder()[key] || [];
  return arr.map((x, i) => [x, i]).sort((a, b) => {
    const ia = o.indexOf(idf(a[0])), ib = o.indexOf(idf(b[0]));
    return (ia < 0 ? 1000 + a[1] : ia) - (ib < 0 ? 1000 + b[1] : ib);
  }).map((p) => p[0]);
}
const sId = (e) => e.dataset.sid || e.dataset.ip || e.dataset.id || "";
const sItemSel = ".pc, .sh-grid > .sh-card, .sh-list > .sh-row";
function sBox(el) { return el.parentElement; }
function sKey(box) { return box.id === "pcs" ? "pcs" : box.dataset.skey; }
function sItems(box) { return Array.from(box.children).filter((e) => e.matches(sItemSel)); }
function sFlip(box, change) {
  const items = sItems(box), before = new Map(items.map((e) => [e, e.getBoundingClientRect()]));
  change();
  items.forEach((e) => {
    if (sDrag && e === sDrag.el) return;
    const a = before.get(e), b = e.getBoundingClientRect(), dx = a.left - b.left, dy = a.top - b.top;
    if (dx || dy) e.animate([{ transform: `translate(${dx}px,${dy}px)` }, { transform: "none" }], { duration: 280, easing: "cubic-bezier(.2,.8,.2,1)" });
  });
}
function sPlace() {
  const d = sDrag; if (!d) return;
  d.el.style.transform = "";
  const r = d.el.getBoundingClientRect();
  d.el.style.transform = `translate(${d.x - d.gx - r.left}px, ${d.y - d.gy - r.top}px) scale(1.04) rotate(-.6deg)`;
}
function sStart(el, ev) {
  const r = el.getBoundingClientRect();
  sDrag = { el, box: sBox(el), id: ev.pointerId, gx: ev.clientX - r.left, gy: ev.clientY - r.top, x: ev.clientX, y: ev.clientY, last: 0 };
  el.classList.add("s-drag");
  try { el.setPointerCapture(ev.pointerId); } catch (e) {}
  try { if (KS && KS.vibrate) KS.vibrate(); } catch (e) {}
  sPlace();
}
document.addEventListener("pointerdown", (ev) => {
  const el = ev.target.closest(sItemSel);
  if (!el || ev.button > 0 || ev.target.closest("button, input, select, a, label")) return;
  const sx = ev.clientX, sy = ev.clientY;
  const t = setTimeout(() => { sPressed = Date.now(); sStart(el, ev); }, 480);
  const cancel = (e) => { if (e.type !== "pointermove" || Math.hypot(e.clientX - sx, e.clientY - sy) > 9) { clearTimeout(t); off(); } };
  const off = () => ["pointermove", "pointerup", "pointercancel"].forEach((n) => document.removeEventListener(n, cancel));
  ["pointermove", "pointerup", "pointercancel"].forEach((n) => document.addEventListener(n, cancel));
});
document.addEventListener("pointermove", (ev) => {
  const d = sDrag; if (!d || ev.pointerId !== d.id) return;
  d.x = ev.clientX; d.y = ev.clientY; sPlace();
  if (Date.now() - d.last < 140) return;
  const over = sItems(d.box).find((e) => { if (e === d.el) return false; const r = e.getBoundingClientRect();
    return d.x >= r.left && d.x <= r.right && d.y >= r.top && d.y <= r.bottom; });
  if (!over) return;
  const r = over.getBoundingClientRect();
  const after = r.width > r.height * 2.2 ? d.y > r.top + r.height / 2 : d.x > r.left + r.width / 2;
  const ref = after ? over.nextSibling : over;
  if (ref === d.el || (after ? over.nextSibling === d.el : over.previousSibling === d.el)) return;
  d.last = Date.now();
  sFlip(d.box, () => d.box.insertBefore(d.el, ref));
  sPlace();
});
function sEnd(ev) {
  const d = sDrag; if (!d || (ev && ev.pointerId !== d.id)) return;
  sDrag = null;
  const from = d.el.style.transform;
  d.el.classList.remove("s-drag"); d.el.style.transform = "";
  d.el.animate([{ transform: from }, { transform: "scale(.97)", offset: 0.7 }, { transform: "none" }], { duration: 520, easing: "cubic-bezier(.2,1.3,.4,1)" });
  d.el.classList.remove("s-glow"); void d.el.offsetWidth; d.el.classList.add("s-glow");
  setTimeout(() => d.el.classList.remove("s-glow"), 900);
  const o = sOrder(); o[sKey(d.box)] = sItems(d.box).map(sId);
  try { localStorage.setItem(SORT_KEY, JSON.stringify(o)); } catch (e) {}
  if (sKey(d.box) === "pcs") setTimeout(() => { render(lastOnline); liveAll(lastOnline); }, 700);
  try { if (KS && KS.vibrate) KS.vibrate(); } catch (e) {}
}
document.addEventListener("pointerup", sEnd);
document.addEventListener("pointercancel", sEnd);
document.addEventListener("touchmove", (ev) => { if (sDrag) ev.preventDefault(); }, { passive: false });
document.addEventListener("contextmenu", (ev) => { if (ev.target.closest(sItemSel)) ev.preventDefault(); });
document.addEventListener("click", (ev) => { if (Date.now() - sPressed < 700 && ev.target.closest(sItemSel)) { ev.preventDefault(); ev.stopPropagation(); } }, true);

function render(online) {
  online = online || {};
  if (sDrag) return;
  pcs.sort((a, b) => (b.last || 0) - (a.last || 0));
  const sorted = sSort("pcs", pcs, (p) => p.host);
  pcs.splice(0, pcs.length, ...sorted);
  const st = (p) => online[p.host];
  const n = pcs.filter((p) => st(p)).length;
  if (pcs.length && Object.keys(online).length) $("#sum").textContent = `${n} av ${pcs.length} PC-er er på`;
  $("#pcs").innerHTML = pcs.map((p, i) => {
    const on = !!st(p), off = st(p) === false;
    const where = st(p) === "ts" ? "via Tailscale" : p.host;
    return `<div class="pc ${on ? "on" : off ? "off" : ""}" data-i="${i}" data-sid="${esc(p.host)}">
      <div class="pc-head"><div class="ic">${p.os === "windows" ? "🪟" : "🐧"}</div>
        <div class="t"><b>${esc(p.name || p.host)}</b><span class="meta"><span class="dot ${on ? "ok" : off ? "bad" : ""}"></span>${on ? "På" : off ? "Av" : "Sjekker"} · ${esc(where)}${p.version ? " · " + esc(p.version) : ""}${p.ts ? " · 🌐" : ""}</span></div>
        <button class="x" title="Fjern fra lista">✕</button></div>
      <div class="stats" id="stats-${i}"></div>
      <div class="game-now" id="game-${i}"></div>
      <div class="hint" id="hint-${i}"></div>
      <div class="pc-actions">${off && p.mac ? '<button class="wake">⏻ Slå på</button>' : ""}<button class="primary go">${on || !off ? "Åpne" : "Prøv å åpne"}</button></div>
    </div>`;
  }).join("") || '<p class="dim">Ingen PC-er ennå – trykk «Søk etter PC-er».</p>';
  document.querySelectorAll(".pc").forEach((el) => {
    const p = pcs[+el.dataset.i];
    el.querySelector(".go").onclick = () => open(p);
    const w = el.querySelector(".wake");
    if (w) w.onclick = () => wake(p);
    el.querySelector(".x").onclick = () => { if (confirm(`Fjerne ${p.name || p.host} fra lista?`)) { pcs.splice(pcs.indexOf(p), 1); save(); render(online); } };
  });
}
async function check() {
  const online = {};
  await Promise.all(pcs.map(async (p) => {
    const r = await reach(p, 2000);
    online[p.host] = r ? (r.h === p.host ? true : "ts") : false;
    if (r) { remember(r.h, r.j); online[r.h] = online[p.host]; }
  }));
  render(online);
  if (KS && KS.rememberHosts) KS.rememberHosts(JSON.stringify(pcs.flatMap((p) => [p.host, p.ts].filter(Boolean))));
  if (KS && KS.rememberPcs) KS.rememberPcs(JSON.stringify(pcs));
  liveAll(online);
  return online;
}

// ---- alle PC-ene på én skjerm: live-status med nøkkelen appen har for hver PC ----
const tokenFor = (p) => (KS && KS.getToken ? KS.getToken(p.name) : "");
const baseFor = (p, online) => `http://${online && online[p.host] === "ts" ? p.ts : p.host}:${PORT}`;
async function authed(p, online, path, body) {
  const t = tokenFor(p);
  if (!t) throw new Error("ikke paret");
  const opt = { headers: { Authorization: "Bearer " + t }, cache: "no-store" };
  if (body) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers["Content-Type"] = "application/json"; }
  const r = await fetch(baseFor(p, online) + path, opt);
  const j = await r.json();
  if (!r.ok) throw new Error(j.error || r.status);
  return j;
}
let lastOnline = {};
async function liveAll(online) {
  lastOnline = online;
  pcs.forEach(async (p, i) => {
    const el = document.getElementById("stats-" + i);
    if (!el || !online[p.host]) return;
    try {
      const s = await authed(p, online, "/api/status");
      const t = (v) => (v == null ? "–" : Math.round(v) + "°");
      el.innerHTML = `<div><div class="n">CPU</div><div class="v">${t(s.cpu && s.cpu.temp)}</div></div>`
        + `<div><div class="n">GPU</div><div class="v">${t(s.gpu && s.gpu.temp)}</div></div>`
        + `<div><div class="n">Strøm</div><div class="v">${s.watts || 0} W</div></div>`;
      const g = document.getElementById("game-" + i);
      if (g) g.textContent = s.game ? "🎮 Spiller " + s.game + (s.gamemode ? " · spillmodus" : "") : "";
    } catch (e) {
      const h = document.getElementById("hint-" + i);
      if (h) h.textContent = e.message === "ikke paret" ? "Trykk «Åpne» og par telefonen for å se status her." : "";
    }
  });
}
// ---- Wake-on-LAN: fra telefonen (hjemme) og via en annen PC som er på (borte, via Tailscale) ----
async function wake(p) {
  if (KS && KS.wol) KS.wol(p.mac);
  const other = pcs.find((x) => x !== p && lastOnline[x.host]);
  if (other) { try { await authed(other, lastOnline, "/api/action", { a: "wol", mac: p.mac }); } catch (e) {} }
  $("#status").textContent = `Sendte «slå på» til ${p.name}. Det tar gjerne 30–60 sekunder før den svarer.`;
  setTimeout(check, 45000);
}
// ---- spill på alle PC-er: hvem har spillet, og hvem er ledig ----
$("#all-games").onclick = async () => {
  $("#games").innerHTML = '<p class="dim">Henter spill …</p>';
  const map = {};
  await Promise.all(pcs.filter((p) => lastOnline[p.host]).map(async (p) => {
    try {
      const [g, s] = await Promise.all([authed(p, lastOnline, "/api/games"), authed(p, lastOnline, "/api/status")]);
      g.games.forEach((x) => { (map[x.name] = map[x.name] || []).push({ p, appid: x.appid, busy: s.game }); });
    } catch (e) {}
  }));
  const names = Object.keys(map).sort((a, b) => a.localeCompare(b, "nb"));
  $("#games").innerHTML = names.map((n, i) => `<div class="gi"><b>${esc(n)}</b><div class="btns">${map[n].map((x, k) =>
    `<button class="${x.busy ? "" : "primary"}" data-g="${i}" data-k="${k}">${esc(x.p.name)}${x.busy ? " (spiller " + esc(x.busy) + ")" : ""}</button>`).join("")}</div></div>`).join("")
    || '<p class="dim">Fant ingen spill (er PC-ene paret?).</p>';
  document.querySelectorAll("[data-g]").forEach((b) => (b.onclick = async () => {
    const x = map[names[+b.dataset.g]][+b.dataset.k];
    try { await authed(x.p, lastOnline, "/api/action", { a: "game", appid: x.appid }); $("#status").textContent = `Starter ${names[+b.dataset.g]} på ${x.p.name} …`; }
    catch (e) { $("#status").textContent = "Feil: " + e.message; }
  }));
};


// ---------- faner nederst: PC-er og Smart Hjem ----------
let curTab = "pcs";
try { curTab = localStorage.getItem("startTab") || "pcs"; } catch (e) {}
function setTab(t) {
  curTab = t;
  try { localStorage.setItem("startTab", t); } catch (e) {}
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("on", b.dataset.tab === t));
  $("#p-pcs").hidden = t !== "pcs"; $("#p-smart").hidden = t !== "smart";
  $("#title").textContent = t === "smart" ? "Smart Hjem" : "Kontrollsenter";
  $("#sum").hidden = t === "smart";
  if (t === "smart") loadSmart(false);
  window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => { if (KS && KS.vibrate) KS.vibrate(); setTab(b.dataset.tab); }));
$("#add-open").onclick = () => { const r = $("#add-row"); r.hidden = !r.hidden; $("#add-open").classList.toggle("on", !r.hidden); if (!r.hidden) $("#manual").focus(); };

// ---------- Smart Hjem: en PC som er på finner og styrer enhetene på hjemmenettet ----------
let smartPc = null, smartData = null, smartTimer = 0, smartHold = 0, showAll = false;
function smartPcPick() {
  const cands = pcs.filter((p) => lastOnline[p.host] && tokenFor(p));
  return cands.find((p) => lastOnline[p.host] === true) || cands[0] || null;
}
async function smartAct(body, quiet) {
  if (!smartPc) return;
  smartHold = Date.now() + 2500;
  try {
    const r = await authed(smartPc, lastOnline, "/api/action", Object.assign({ a: "smart" }, body));
    if (!quiet) $("#smart-status").textContent = r.ok ? (r.msg && r.msg !== "OK" ? r.msg : "") : "Feil: " + (r.msg || r.error || "");
    setTimeout(() => loadSmart(false, true), 900);
  } catch (e) { $("#smart-status").textContent = "Feil: " + e.message; }
}
async function loadSmart(rescan, silent) {
  clearTimeout(smartTimer);
  if (curTab !== "smart") return;
  if (!Object.keys(lastOnline).length) await check();
  smartPc = smartPcPick();
  if (!smartPc) {
    $("#smart-from").textContent = "";
    $("#smart").innerHTML = `<div class="sh-empty"><span class="big">🏠</span><b>Ingen PC er på akkurat nå</b><br>Smart Hjem hentes fra en av PC-ene med Kontrollsenter.
      Slå på en PC (og par telefonen med den under «PC-er»), så dukker lysene, TV-ene og de andre enhetene opp her.</div>`;
    return;
  }
  if (!silent && !smartData) $("#smart").innerHTML = '<div class="sh-empty"><span class="big">📡</span>Leter etter enheter på hjemmenettet …</div>';
  if (rescan) $("#smart-status").textContent = "Søker etter enheter … (tar 5–10 sekunder)";
  try {
    const d = await authed(smartPc, lastOnline, "/api/x/smart" + (rescan ? "?scan=1" : ""));
    if (Date.now() < smartHold && !rescan) { smartTimer = setTimeout(() => loadSmart(false, true), 1500); return; }
    smartData = d;
    if (rescan) $("#smart-status").textContent = "";
    renderSmart(d);
  } catch (e) {
    $("#smart-status").textContent = "Fikk ikke hentet fra " + smartPc.name + ": " + e.message;
  }
  smartTimer = setTimeout(() => loadSmart(false, true), 8000);
}
$("#smart-scan").onclick = () => loadSmart(true);

const KIND_ORDER = { hub: "Lys", light: "Lys", tv: "Andre TV-er og høyttalere", cast: "Andre TV-er og høyttalere", speaker: "Andre TV-er og høyttalere",
  plug: "Smartenheter", camera: "Smartenheter", pc: "PC-er og konsoller", console: "PC-er og konsoller", nas: "Nettverk", router: "Nettverk",
  printer: "Nettverk", phone: "Mobiler og nettbrett", other: "Andre enheter" };
function devMeta(d) { return [d.kind_name, d.model || d.maker, d.ip].filter(Boolean).join(" · "); }

function hueCard(h, hub) {
  if (!h.paired) {
    return `<div class="sh-card"><div class="sh-head"><div class="sh-ic">💡</div><div class="sh-t"><b>Philips Hue</b><span>${esc(hub ? hub.ip : "")}</span></div></div>
      <div class="hint">Trykk på den runde knappen på Hue-broen, og trykk «Koble til» innen 30 sekunder.</div>
      <div class="sh-btns"><button data-sh="huepair">🔗 Koble til Hue</button></div></div>`;
  }
  if (h.error) return `<div class="sh-card"><div class="sh-head"><div class="sh-ic">💡</div><div class="sh-t"><b>Philips Hue</b><span>${esc(h.error)}</span></div></div></div>`;
  const anyOn = h.lights.some((l) => l.on);
  const rooms = h.rooms.map((r) => `<button class="${r.any_on ? "on" : ""}" data-room="${esc(r.id)}" data-on="${r.any_on ? 0 : 1}">${esc(r.name)}</button>`).join("");
  const lights = h.lights.map((l) => `<div class="sh-light ${l.on ? "" : "off"}" data-light="${esc(l.id)}">
      <label class="switch"><input type="checkbox" class="l-on" ${l.on ? "checked" : ""} ${l.reachable ? "" : "disabled"}><i></i></label>
      <div class="nm">${esc(l.name)}${l.reachable ? "" : "<small>Svarer ikke (strømmen av?)</small>"}</div>
      ${l.can_color ? `<input type="color" class="l-col" value="${esc(l.color || "#ffd9a0")}" ${l.reachable ? "" : "disabled"}>` : "<span></span>"}
      ${l.can_dim && l.reachable ? `<input type="range" class="l-bri" min="1" max="254" value="${l.bri || 1}">` : ""}</div>`).join("");
  return `<div class="sh-card ${anyOn ? "live" : ""}"><div class="sh-head"><div class="sh-ic">💡</div>
      <div class="sh-t"><b>Lys</b><span>${h.lights.filter((l) => l.on).length} av ${h.lights.length} er på · Philips Hue</span></div>
      <label class="switch"><input type="checkbox" id="hue-all" ${anyOn ? "checked" : ""}><i></i></label></div>
    ${rooms ? `<div class="sh-rooms">${rooms}</div>` : ""}
    <div class="sh-lights">${lights || '<div class="dim small">Ingen lys funnet på broen.</div>'}</div></div>`;
}
function tvCard(d) {
  const L = d.live || {}, on = L.power === "on";
  return `<div class="sh-card ${on ? "live" : ""}" data-ip="${esc(d.ip)}" data-ctl="tv"><div class="sh-head"><div class="sh-ic">📺</div>
      <div class="sh-t"><b>${esc(d.name || "TV")}</b><span>${on ? "På" : L.power === "standby" ? "Hvilemodus" : "Av"} · ${esc(d.model || d.maker)}</span></div>
      <button class="${on ? "on" : ""}" data-key="${on ? "power" : "on"}" title="Av/på" style="min-width:52px">⏻</button></div>
    ${on ? `<div class="sh-btns"><button data-key="voldown">🔉</button><button data-key="mute">🔇</button><button data-key="volup">🔊</button></div>
    <div class="sh-btns"><button data-key="home">⌂ Hjem</button><button data-key="source">⇄ Kilde</button><button data-key="play">⏵</button><button data-key="pause">⏸</button></div>` : ""}
    ${L.paired ? "" : '<div class="hint">Første gang du trykker: velg «Tillat» på TV-en.</div>'}</div>`;
}
function castCard(d) {
  const L = d.live;
  if (!L) return `<div class="sh-card" data-ip="${esc(d.ip)}"><div class="sh-head"><div class="sh-ic">${d.icon}</div><div class="sh-t"><b>${esc(d.name)}</b><span>${esc(devMeta(d))} · svarer ikke</span></div></div></div>`;
  const playing = L.playing === true;
  return `<div class="sh-card ${L.app ? "live" : ""}" data-ip="${esc(d.ip)}" data-ctl="cast"><div class="sh-head"><div class="sh-ic">${d.icon}</div>
      <div class="sh-t"><b>${esc(d.name)}</b><span>${esc(d.model || d.kind_name)}</span></div>
      <button class="${L.muted ? "on" : ""}" data-cast="mute" data-v="${L.muted ? 0 : 1}" title="Demp" style="min-width:52px">🔇</button></div>
    ${L.app ? `<div class="sh-now">▶ ${esc(L.app)}${L.title && L.title !== L.app ? " – " + esc(L.title) : ""}</div>
      <div class="sh-btns"><button class="${playing ? "on" : ""}" data-cast="${playing ? "pause" : "play"}">${playing ? "⏸ Pause" : "⏵ Spill"}</button><button data-cast="stop">⏹ Stopp</button></div>`
      : '<div class="dim small">Ingenting spilles nå</div>'}
    <div class="sh-vol">🔈<input type="range" class="c-vol" min="0" max="100" value="${L.volume}"><span class="num">${L.volume} %</span></div></div>`;
}
function renderSmart(d) {
  const devs = d.devices || [];
  const when = d.scanned ? new Date(d.scanned * 1000).toLocaleTimeString("nb-NO", { hour: "2-digit", minute: "2-digit" }) : "";
  $("#smart-from").textContent = `Via ${smartPc.name}${when ? " · " + when : ""}${d.scanning ? " · søker …" : ""}`;
  const hub = devs.find((x) => (x.control || []).includes("hue"));
  const tvs = devs.filter((x) => (x.control || []).includes("samsung"));
  const casts = devs.filter((x) => (x.control || []).includes("cast"));
  const ctl = new Set([hub, ...tvs, ...casts].filter(Boolean));
  const rest = devs.filter((x) => !ctl.has(x));
  let html = "";
  if (hub || (d.hue && d.hue.paired)) html += `<div class="sh-sec">Lys</div><div class="sh-grid">${hueCard(d.hue || {}, hub)}</div>`;
  if (tvs.length || casts.length) html += `<div class="sh-sec">TV, strømming og høyttalere</div><div class="sh-grid" data-skey="sh-tv">${sSort("sh-tv", [...tvs, ...casts], (x) => x.ip).map((x) => (tvs.includes(x) ? tvCard(x) : castCard(x))).join("")}</div>`;
  const named = rest.filter((x) => x.name || !["phone", "other"].includes(x.kind));
  const anon = rest.filter((x) => !named.includes(x));
  const groups = {};
  named.forEach((x) => { const g = KIND_ORDER[x.kind] || "Andre enheter"; (groups[g] = groups[g] || []).push(x); });
  const row = (x) => `<div class="sh-row" data-id="${esc(x.id)}" data-name="${esc(x.name)}"><span class="e">${x.icon}</span>
      <div class="sh-t"><b>${esc(x.name || x.kind_name)}</b><span>${esc([x.name ? x.kind_name : "", x.model || x.maker].filter(Boolean).join(" · "))}</span></div><span class="ip">${esc(x.ip)}</span></div>`;
  Object.entries(groups).forEach(([g, list]) => { html += `<div class="sh-sec">${esc(g)}</div><div class="sh-list" data-skey="sh-${esc(g)}">${sSort("sh-" + g, list, (x) => x.id).map(row).join("")}</div>`; });
  if (anon.length) {
    html += `<div class="sh-sec">Uten navn (${anon.length})</div>`;
    html += showAll ? `<div class="sh-list">${anon.map(row).join("")}</div><div class="dim small" style="margin:8px 4px">Trykk på en enhet for å gi den et navn.</div>`
      : `<button class="sh-more" id="sh-more">Vis ${anon.length} enheter uten navn (mobiler, nettbrett …)</button>`;
  }
  if (!devs.length) html = `<div class="sh-empty"><span class="big">📡</span>Leter etter enheter … trykk «Søk på nytt» om litt.</div>`;
  // ikke tegn på nytt mens du drar i en glidebryter
  const a = document.activeElement;
  if (a && a.type === "range" && $("#smart").contains(a)) return;
  if (sDrag) return;
  $("#smart").innerHTML = html;
  wireSmart();
}
function wireSmart() {
  const S = $("#smart");
  const m = S.querySelector("#sh-more"); if (m) m.onclick = () => { showAll = true; renderSmart(smartData); };
  S.querySelectorAll("[data-sh=huepair]").forEach((b) => (b.onclick = () => smartAct({ do: "huepair" })));
  const all = S.querySelector("#hue-all"); if (all) all.onchange = () => smartAct({ do: "hue", on: all.checked }, true);
  S.querySelectorAll("[data-room]").forEach((b) => (b.onclick = () => { b.classList.toggle("on", b.dataset.on === "1"); smartAct({ do: "hue", room: b.dataset.room, on: b.dataset.on === "1" }, true); }));
  S.querySelectorAll("[data-light]").forEach((el) => {
    const id = el.dataset.light, on = el.querySelector(".l-on"), bri = el.querySelector(".l-bri"), col = el.querySelector(".l-col");
    if (on) on.onchange = () => { el.classList.toggle("off", !on.checked); smartAct({ do: "hue", light: id, on: on.checked }, true); };
    if (bri) bri.onchange = () => { on.checked = true; el.classList.remove("off"); smartAct({ do: "hue", light: id, bri: +bri.value }, true); };
    if (col) col.onchange = () => { on.checked = true; el.classList.remove("off"); smartAct({ do: "hue", light: id, color: col.value }, true); };
  });
  S.querySelectorAll("[data-ctl=tv] [data-key]").forEach((b) => (b.onclick = () => {
    if (KS && KS.vibrate) KS.vibrate();
    smartAct({ do: "tv", ip: b.closest("[data-ip]").dataset.ip, key: b.dataset.key }, b.dataset.key !== "on" && b.dataset.key !== "power");
  }));
  S.querySelectorAll("[data-ctl=cast] [data-cast]").forEach((b) => (b.onclick = () => {
    const ip = b.closest("[data-ip]").dataset.ip, w = b.dataset.cast;
    if (w === "mute") b.classList.toggle("on", b.dataset.v === "1");
    smartAct({ do: "cast", ip, what: w, value: w === "mute" ? b.dataset.v === "1" : null }, true);
  }));
  S.querySelectorAll("[data-ctl=cast] .c-vol").forEach((r) => {
    const lab = r.parentNode.querySelector(".num");
    r.oninput = () => { lab.textContent = r.value + " %"; };
    r.onchange = () => smartAct({ do: "cast", ip: r.closest("[data-ip]").dataset.ip, what: "volume", value: +r.value }, true);
  });
  S.querySelectorAll(".sh-row").forEach((el) => (el.onclick = () => {
    const n = prompt("Navn på enheten:", el.dataset.name || "");
    if (n != null && n.trim()) smartAct({ do: "rename", id: el.dataset.id, name: n.trim() });
  }));
}

// ---- oppdatering av appen: PC-ene leser NAS-en (Kontrollsenter/Android) ----
window.ksUpdateStatus = (m) => { $("#upd").hidden = false; $("#upd-t").textContent = m; };
async function checkUpdate(force, online) {
  const have = KS && KS.versionCode ? Number(KS.versionCode()) : 0;
  let best = null;
  const hosts = pcs.map((p) => (online && online[p.host] === "ts" ? p.ts : p.host)).filter((h, i) => h && (!online || online[pcs[i].host]));
  await Promise.all(hosts.map(async (h) => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), force ? 15000 : 4000);
    try {
      const r = await (await fetch(`http://${h}:${PORT}/api/appupdate${force ? "?force=1" : ""}`, { signal: ctl.signal, cache: "no-store" })).json();
      if (r.code && (!best || r.code > best.code)) best = Object.assign(r, { host: h });
    } catch (e) {} finally { clearTimeout(t); }
  }));
  // GitHub også: appen sjekker der ved oppstart (KS.githubCached) – vent litt på svaret hvis det ikke er klart
  if (KS && KS.githubCached) {
    let gh = "";
    for (let i = 0; i < (force ? 40 : 12) && !(gh = KS.githubCached()); i++) await new Promise((ok) => setTimeout(ok, 250));
    try {
      const g = gh ? JSON.parse(gh) : null;
      if (g && g.code && g.url && (!best || g.code > best.code)) best = { version: g.version, code: g.code, url: g.url, source: "github" };
    } catch (e) {}
  }
  if (best && best.code > have) {
    const from = best.source === "github" ? "GitHub" : "hjemmenettet";
    $("#upd").hidden = false;
    $("#upd-t").textContent = `Oppdatering klar: Kontrollsenter ${best.version} fra ${from} (du har ${KS && KS.version ? KS.version() : "eldre"})`;
    $("#upd-go").onclick = () => KS && KS.update && KS.update(best.url || `http://${best.host}:${PORT}/api/apk`);
    return best;
  }
  if (force) $("#status").textContent = best ? "Appen er oppdatert ✓" : "Fikk ikke svar fra noen PC – er Kontrollsenter i gang?";
  return null;
}
$("#upd-check").onclick = async () => { $("#status").textContent = "Sjekker NAS-en via PC-ene …"; await checkUpdate(true); };
// «Oppdater fra GitHub»: virker uten PC og hjemmenett – henter nyeste app rett fra GitHub
if (KS && KS.githubLatest) {
  $("#upd-gh").hidden = false;
  $("#upd-gh").onclick = async () => {
    $("#status").textContent = "Sjekker GitHub …";
    await new Promise((ok) => setTimeout(ok, 30));
    let r = {}; try { r = JSON.parse(KS.githubLatest()); } catch (e) { r = { error: e.message }; }
    if (r.error) { $("#status").textContent = "GitHub: " + r.error; return; }
    const have = KS.versionCode ? Number(KS.versionCode()) : 0;
    if (r.code > have) {
      $("#upd").hidden = false;
      $("#upd-t").textContent = `Kontrollsenter ${r.version} på GitHub (du har ${KS.version ? KS.version() : "eldre"})`;
      $("#upd-go").onclick = () => KS.update(r.url);
      $("#status").textContent = `Versjon ${r.version} er klar – trykk «Oppdater»`;
    } else $("#status").textContent = `Appen er oppdatert ✓ (nyeste på GitHub: ${r.version})`;
  };
}
async function scan() {
  const sn = KS ? KS.subnet() : "";
  const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/.exec(sn);
  // eget nett først, så de vanligste hjemmenettene (hvis telefonen f.eks. har VPN på eller ikke vet nettet)
  const bases = [...new Set([m ? `${m[1]}.${m[2]}.${m[3]}.` : null, "192.168.1.", "192.168.0."].filter(Boolean))];
  $("#status").textContent = `Søker i ${bases.map((b) => b + "x").join(" og ")} …`; $("#scan-bar").hidden = false; $("#scan").disabled = true;
  let done = 0; const seen = new Set(); const queue = bases.flatMap((base) => Array.from({ length: 254 }, (_, i) => base + (i + 1)));
  const total = queue.length;
  async function worker() {
    while (queue.length) {
      const h = queue.shift(); const j = await hello(h, 1200);
      if (j) { remember(h, j); seen.add(j.name || h); render(); }
      done++; $("#scan-bar i").style.width = (done / total) * 100 + "%";
    }
  }
  await Promise.all(Array.from({ length: 48 }, worker));
  $("#scan").disabled = false; $("#scan-bar").hidden = true;
  const found = seen.size;
  $("#status").textContent = found ? `Fant ${found} PC${found > 1 ? "-er" : ""} med Kontrollsenter.` :
    "Fant ingen. Sjekk at telefonen er på hjemme-Wi-Fi (ikke gjestenett/mobildata), at Kontrollsenter kjører og at «Tillat fjernstyring» er på – eller skriv inn adressen (f.eks. 192.168.1.22).";
  check();
}
$("#scan").onclick = scan;
$("#add").onclick = async () => {
  const h = $("#manual").value.trim().replace(/^https?:\/\//, "").replace(/[:/].*$/, "");
  if (!h) return;
  $("#status").textContent = "Kobler til " + h + " …";
  const j = await hello(h, 3000);
  if (!j) { $("#status").textContent = `Fikk ikke svar fra ${h}:${PORT}.`; return; }
  remember(h, j); $("#manual").value = ""; $("#status").textContent = "La til " + j.name; render();
};
$("#manual").addEventListener("keydown", (e) => e.key === "Enter" && $("#add").click());
if (KS && KS.version) $("#ver").textContent = "App-versjon " + KS.version();

(async () => {
  render();
  if (curTab === "smart") { const online = await check(); setTab("smart"); checkUpdate(false, online); return; }
  const home = /[?&](hjem|oppdater)=1/.test(location.search);
  const last = localStorage.getItem("lastHost");
  if (/[?&]oppdater=1/.test(location.search)) { await check(); await checkUpdate(true); return; }
  if (!home && last) {                          // åpne sist brukte PC direkte hvis den svarer
    $("#status").textContent = "Kobler til sist brukte PC …";
    const p = pcs.find((x) => x.host === last);
    const r = p && await reach(p, 1500);
    if (r) {
      if (KS && KS.rememberHosts) KS.rememberHosts(JSON.stringify(pcs.flatMap((x) => [x.host, x.ts].filter(Boolean))));
      if (!(await checkUpdate(false, { [p.host]: r.h === p.host ? true : "ts" }))) return open(p);  // banner først ved ny app
    }
    $("#status").textContent = "";
  }
  const online = await check();
  checkUpdate(false, online);
  if (!pcs.length) scan();
  else if (!Object.values(online).some(Boolean)) $("#status").textContent = "Ingen av PC-ene svarer akkurat nå. Prøv «Søk etter PC-er».";
})();

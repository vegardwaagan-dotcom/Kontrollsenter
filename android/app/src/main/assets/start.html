<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kontrollsenter</title>
<style>
:root { --bg:#1e1e24; --card:#2a2a32; --card2:#33333d; --fg:#f2f2f5; --dim:#a3a3b0; --line:#3c3c47; --acc:#3584e4; --ok:#33b36b; --bad:#e0464b; }
@media (prefers-color-scheme: light) { :root { --bg:#f4f4f7; --card:#fff; --card2:#ececf1; --fg:#1d1d22; --dim:#62626e; --line:#dcdce3; } }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui, Roboto, sans-serif; }
main { max-width:1100px; margin:0 auto; padding:20px 16px 40px; }
h1 { font-size:26px; margin:6px 0 2px; } .dim { color:var(--dim); } .small { font-size:13px; }
.bar { display:flex; gap:10px; margin:18px 0; flex-wrap:wrap; }
button { font:inherit; color:var(--fg); background:var(--card2); border:0; border-radius:12px; padding:12px 18px; min-height:48px; }
button.primary { background:var(--acc); color:#fff; }
input { font:inherit; color:var(--fg); background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px 14px; flex:1; min-width:180px; }
.list { display:grid; gap:14px; grid-template-columns:repeat(auto-fill, minmax(300px, 1fr)); }
.pc { background:var(--card); border-radius:18px; padding:18px; display:flex; gap:14px; align-items:center; }
.pc .ic { width:52px; height:52px; border-radius:14px; background:var(--card2); display:flex; align-items:center; justify-content:center; font-size:26px; flex:none; }
.pc .t { flex:1; min-width:0; } .pc b { display:block; font-size:18px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pc .x { background:transparent; color:var(--dim); padding:8px 10px; min-height:40px; }
.dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--dim); margin-right:6px; }
.dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
.upd { display:flex; align-items:center; gap:12px; padding:12px 16px; background:var(--acc); color:#fff; border-radius:16px; margin:14px 0; }
.upd span { flex:1; } .upd button { background:#fff; color:var(--acc); }
#scan-bar { height:4px; background:var(--card2); border-radius:2px; overflow:hidden; margin-top:8px; }
#scan-bar i { display:block; height:100%; width:0; background:var(--acc); transition:width .2s; }
</style>
</head>
<body>
<main>
  <h1>Kontrollsenter</h1>
  <div class="dim">Velg PC-en du vil styre. PC-en må ha Kontrollsenter med <b>Tillat fjernstyring</b> slått på
    (Hjemme → Mobil og nettbrett).</div>
  <div id="upd" class="upd" hidden><span id="upd-t"></span><button id="upd-go">Oppdater nå</button></div>
  <div class="bar">
    <button id="scan" class="primary">Søk etter PC-er</button>
    <button id="upd-check">Se etter oppdatering</button>
    <input id="manual" placeholder="Eller skriv adressen, f.eks. 192.168.1.20" inputmode="url">
    <button id="add">Legg til</button>
  </div>
  <div id="status" class="dim small"></div>
  <div id="scan-bar" hidden><i></i></div>
  <h2 class="dim small" style="text-transform:uppercase;letter-spacing:.5px;margin-top:24px">PC-er</h2>
  <div id="pcs" class="list"></div>
  <p class="dim small" id="ver"></p>
</main>
<script>
"use strict";
const PORT = 27100, $ = (s) => document.querySelector(s);
const KS = window.KS || null;
let pcs = []; try { pcs = JSON.parse(localStorage.getItem("pcs") || "[]"); } catch (e) {}
const save = () => localStorage.setItem("pcs", JSON.stringify(pcs));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));

async function hello(host, ms) {
  const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), ms || 1500);
  try {
    const r = await fetch(`http://${host}:${PORT}/api/hello`, { signal: ctl.signal, cache: "no-store" });
    const j = await r.json();
    return j && j.app === "Kontrollsenter" ? j : null;
  } catch (e) { return null; } finally { clearTimeout(t); }
}
const isTs = (h) => /^100\.(6[4-9]|[7-9]\d|1[01]\d|12[0-7])\./.test(h) || /\.ts\.net$/.test(h);
function remember(host, j) {
  const p = pcs.find((x) => (j.name && x.name === j.name) || x.host === host || x.ts === host);
  const lan = isTs(host) ? (p && p.host) || (j.lan || [])[0] || host : host;
  const info = { host: lan, name: j.name, os: j.os, version: j.version };
  if (j.ts) { info.ts = j.ts.ip; info.tsname = j.ts.name; }
  if (p) Object.assign(p, info); else pcs.push(info);
  save();
}
// hjemme: hjemmeadressen; ute: Tailscale-adressen (eller -navnet)
async function reach(p, ms) {
  for (const h of [p.host, p.ts, p.tsname].filter(Boolean)) {
    const j = await hello(h, isTs(h) ? Math.max(ms || 1500, 3000) : (ms || 1500));
    if (j) return { h, j };
  }
  return null;
}
async function open(p) {
  $("#status").textContent = "Kobler til " + (p.name || p.host) + " …";
  const r = await reach(p);
  if (!r) { $("#status").textContent = `${p.name || p.host} svarer ikke – hjemme eller via Tailscale.`; return; }
  p.last = Date.now(); remember(r.h, r.j);
  localStorage.setItem("lastHost", p.host);
  location.href = `http://${r.h}:${PORT}/app/`;
}
function render(online) {
  online = online || {};
  pcs.sort((a, b) => (b.last || 0) - (a.last || 0));
  $("#pcs").innerHTML = pcs.map((p, i) => `<div class="pc" data-i="${i}"><div class="ic">${p.os === "windows" ? "🪟" : "🐧"}</div>
    <div class="t"><b>${esc(p.name || p.host)}</b><span class="dim small"><span class="dot ${online[p.host] ? "ok" : online[p.host] === false ? "bad" : ""}"></span>${esc(online[p.host] === "ts" ? "via Tailscale" : p.host)} · ${esc(p.version || "")}${p.ts ? " · 🌐" : ""}</span></div>
    <button class="primary go">Åpne</button><button class="x" title="Fjern">✕</button></div>`).join("")
    || '<p class="dim">Ingen PC-er ennå – trykk «Søk etter PC-er».</p>';
  document.querySelectorAll(".pc").forEach((el) => {
    const p = pcs[+el.dataset.i];
    el.querySelector(".go").onclick = () => open(p);
    el.querySelector(".x").onclick = () => { pcs.splice(pcs.indexOf(p), 1); save(); render(online); };
  });
}
async function check() {
  const online = {};
  await Promise.all(pcs.map(async (p) => {
    const r = await reach(p, 2000);
    online[p.host] = r ? (r.h === p.host ? true : "ts") : false;
    if (r) { remember(r.h, r.j); online[r.h] = online[p.host]; }
  }));
  render(online);
  if (KS && KS.rememberHosts) KS.rememberHosts(JSON.stringify(pcs.flatMap((p) => [p.host, p.ts].filter(Boolean))));
  return online;
}

// ---- oppdatering av appen: PC-ene leser NAS-en (Kontrollsenter/Android) ----
window.ksUpdateStatus = (m) => { $("#upd").hidden = false; $("#upd-t").textContent = m; };
async function checkUpdate(force, online) {
  const have = KS && KS.versionCode ? Number(KS.versionCode()) : 0;
  let best = null;
  const hosts = pcs.map((p) => (online && online[p.host] === "ts" ? p.ts : p.host)).filter((h, i) => h && (!online || online[pcs[i].host]));
  await Promise.all(hosts.map(async (h) => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), force ? 15000 : 4000);
    try {
      const r = await (await fetch(`http://${h}:${PORT}/api/appupdate${force ? "?force=1" : ""}`, { signal: ctl.signal, cache: "no-store" })).json();
      if (r.code && (!best || r.code > best.code)) best = Object.assign(r, { host: h });
    } catch (e) {} finally { clearTimeout(t); }
  }));
  if (best && best.code > have) {
    $("#upd").hidden = false;
    $("#upd-t").textContent = `Kontrollsenter ${best.version} er klar (du har ${KS && KS.version ? KS.version() : "eldre"})`;
    $("#upd-go").onclick = () => KS && KS.update && KS.update(`http://${best.host}:${PORT}/api/apk`);
    return best;
  }
  if (force) $("#status").textContent = best ? "Appen er oppdatert ✓" : "Fikk ikke svar fra noen PC – er Kontrollsenter i gang?";
  return null;
}
$("#upd-check").onclick = async () => { $("#status").textContent = "Sjekker NAS-en via PC-ene …"; await checkUpdate(true); };
async function scan() {
  const sn = KS ? KS.subnet() : "";
  const m = /^(\d+)\.(\d+)\.(\d+)\.(\d+)\/(\d+)$/.exec(sn);
  if (!m) { $("#status").textContent = "Fant ikke nettverksadressen – er nettbrettet på Wi-Fi? Skriv inn adressen til PC-en."; return; }
  const base = `${m[1]}.${m[2]}.${m[3]}.`;
  $("#status").textContent = `Søker i ${base}0/24 …`; $("#scan-bar").hidden = false; $("#scan").disabled = true;
  let done = 0; const seen = new Set(); const queue = Array.from({ length: 254 }, (_, i) => base + (i + 1));
  async function worker() {
    while (queue.length) {
      const h = queue.shift(); const j = await hello(h, 1200);
      if (j) { remember(h, j); seen.add(j.name || h); render(); }
      done++; $("#scan-bar i").style.width = (done / 254) * 100 + "%";
    }
  }
  await Promise.all(Array.from({ length: 48 }, worker));
  $("#scan").disabled = false; $("#scan-bar").hidden = true;
  const found = seen.size;
  $("#status").textContent = found ? `Fant ${found} PC${found > 1 ? "-er" : ""} med Kontrollsenter.` :
    "Fant ingen. Sjekk at Kontrollsenter kjører og at «Tillat fjernstyring» er på.";
  check();
}
$("#scan").onclick = scan;
$("#add").onclick = async () => {
  const h = $("#manual").value.trim().replace(/^https?:\/\//, "").replace(/[:/].*$/, "");
  if (!h) return;
  $("#status").textContent = "Kobler til " + h + " …";
  const j = await hello(h, 3000);
  if (!j) { $("#status").textContent = `Fikk ikke svar fra ${h}:${PORT}.`; return; }
  remember(h, j); $("#manual").value = ""; $("#status").textContent = "La til " + j.name; render();
};
$("#manual").addEventListener("keydown", (e) => e.key === "Enter" && $("#add").click());
if (KS && KS.version) $("#ver").textContent = "App-versjon " + KS.version();

(async () => {
  render();
  const home = /[?&](hjem|oppdater)=1/.test(location.search);
  const last = localStorage.getItem("lastHost");
  if (/[?&]oppdater=1/.test(location.search)) { await check(); await checkUpdate(true); return; }
  if (!home && last) {                          // åpne sist brukte PC direkte hvis den svarer
    $("#status").textContent = "Kobler til sist brukte PC …";
    const p = pcs.find((x) => x.host === last);
    const r = p && await reach(p, 1500);
    if (r) {
      if (KS && KS.rememberHosts) KS.rememberHosts(JSON.stringify(pcs.flatMap((x) => [x.host, x.ts].filter(Boolean))));
      if (!(await checkUpdate(false, { [p.host]: r.h === p.host ? true : "ts" }))) return open(p);  // banner først ved ny app
    }
    $("#status").textContent = "";
  }
  const online = await check();
  checkUpdate(false, online);
  if (!pcs.length) scan();
  else if (!Object.values(online).some(Boolean)) $("#status").textContent = "Ingen av PC-ene svarer akkurat nå. Prøv «Søk etter PC-er».";
})();
</script>
</body>
</html>
